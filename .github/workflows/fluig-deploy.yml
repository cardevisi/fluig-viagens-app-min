# fluig-deploy.yml
#
# Workflow de deploy automatizado de recursos Fluig no GitHub Actions.
#
# Pode ser disparado de duas formas:
#  1. Manualmente (workflow_dispatch): o usuário escolhe o tipo de recurso,
#     opcionalmente um arquivo específico e se quer apenas simular (dry-run).
#  2. Automaticamente (workflow_run): quando o workflow "Tests" termina com
#     sucesso na branch main após mudanças relevantes.
#
# Fluxo de execução:
#  1. O workflow "Tests" valida as mudanças.
#  2. Se ele concluir com sucesso na main, este workflow é disparado automaticamente.
#  3. No disparo manual, este workflow também roda os testes antes do deploy.
#  4. Faz checkout do código correto.
#  5. Instala o Node.js 22.
#  6. Prepara o Fluig CLI standalone.
#  7. Executa o deploy.
#
# Secrets necessários (Settings > Secrets and variables > Actions > Secrets):
#  - FLUIG_BASE_URL    URL base do servidor Fluig  (ex.: https://fluig.empresa.com)
#  - FLUIG_USERNAME    Usuário de autenticação no Fluig
#  - FLUIG_PASSWORD    Senha de autenticação no Fluig
#
# Variáveis de repositório (Settings > Secrets and variables > Actions > Variables):
#  - FLUIG_SERVER_NAME           Nome lógico do servidor no CLI (opcional)
#  - FLUIG_CLI_DOWNLOAD_URL      URL de download do binário do Fluig CLI
#  - FLUIG_CLI_SHA256            Checksum SHA-256 do binário para validação de integridade
#  - FLUIG_DEPLOY_COMMAND_TEMPLATE Template do comando de deploy com placeholders {{variavel}}

name: Fluig Deploy

# ---------------------------------------------------------------------------
# Gatilhos do workflow
# ---------------------------------------------------------------------------
on:
  # Disparo manual pelo painel do GitHub Actions, com parâmetros configuráveis.
  workflow_dispatch:
    inputs:
      resource_type:
        description: Tipo de recurso para publicar
        required: true
        default: dataset
        type: choice
        options:
          - dataset
      resource_path:
        # Quando vazio, todos os arquivos do tipo selecionado serão publicados.
        description: Caminho relativo do recurso; vazio publica todos do tipo
        required: false
        type: string
      dry_run:
        # Útil para validar o fluxo sem efetuar mudanças no servidor Fluig.
        description: Apenas exibe os comandos sem executar o deploy
        required: true
        default: false
        type: boolean

  # Disparo automático após o workflow de testes concluir na main.
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

# ---------------------------------------------------------------------------
# Permissões mínimas necessárias para o workflow.
# "contents: read" permite apenas leitura do repositório (checkout).
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  deploy:
    name: Deploy Fluig Resource
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    # Variáveis de ambiente disponíveis em todos os steps do job.
    # Secrets (${{ secrets.* }}) são valores sensíveis criptografados.
    # Vars (${{ vars.* }}) são variáveis de repositório não sensíveis.
    env:
      # Token automático do Actions, usado pelo gh CLI para releases privadas.
      GITHUB_TOKEN: ${{ github.token }}

      # Credenciais de acesso ao servidor Fluig (secrets).
      FLUIG_BASE_URL: ${{ secrets.FLUIG_BASE_URL }}
      FLUIG_USERNAME: ${{ secrets.FLUIG_USERNAME }}
      FLUIG_PASSWORD: ${{ secrets.FLUIG_PASSWORD }}

      # Configurações do CLI e do deploy (variáveis de repositório).
      FLUIG_SERVER_NAME: ${{ vars.FLUIG_SERVER_NAME }}
      FLUIG_CLI_DOWNLOAD_URL: ${{ vars.FLUIG_CLI_DOWNLOAD_URL }}
      FLUIG_CLI_SHA256: ${{ vars.FLUIG_CLI_SHA256 }}
      FLUIG_DEPLOY_COMMAND_TEMPLATE: ${{ vars.FLUIG_DEPLOY_COMMAND_TEMPLATE }}

      # Parâmetros de execução: usam input manual ou valores padrão no modo automático.
      FLUIG_RESOURCE_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resource_type || 'dataset' }}
      FLUIG_RESOURCE_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resource_path || '' }}
      FLUIG_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

    steps:
      # Faz checkout do repositório no runner para que os scripts e arquivos estejam disponíveis.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Instala o Node.js 22, necessário para executar o script de deploy (.mjs).
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run dataset unit tests
        if: github.event_name == 'workflow_dispatch'
        run: npm test

      - name: standalone
        run: bash .github/scripts/setup-standalone-cli.sh

      # Executa o deploy propriamente dito: autentica no servidor Fluig e publica os recursos.
      # Lê FLUIG_CLI_PATH (exportado pelo step anterior) e todas as envs do job.
      - name: Execute Fluig deploy
        run: node .github/scripts/fluig-resource-deploy.mjs
