# tests.yml
#
# Workflow de integração contínua: executa os testes unitários dos datasets em
# pull requests e em pushes para branches que não sejam a main (ex.: feature branches).
# Pushes na main já rodam os testes como etapa obrigatória do fluig-deploy.yml,
# que bloqueia o deploy caso algum teste falhe.

name: Tests

on:
  push:
    branches-ignore:
      - main
    paths:
      - "datasets/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "datasets/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run dataset unit tests
        run: npm test
