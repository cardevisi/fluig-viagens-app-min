# fluig-tests.yml
#
# Workflow de integração contínua: executa os testes unitários dos datasets em
# pull requests e em pushes para qualquer branch relevante, inclusive a main.
# O workflow de deploy automático escuta a conclusão deste workflow na main e
# só publica recursos quando ele termina com sucesso.

name: Tests

on:
  push:
    paths:
      - "datasets/**"
      - "tests/**"
      - "fluig.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "package.json"
  pull_request:
    paths:
      - "datasets/**"
      - "tests/**"
      - "fluig.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "package.json"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run dataset unit tests
        run: npm test
